<template>

    <!-- ===== PDF VIEWER MODAL ===== -->
    <template if:true={showPdfModal}>
        <div class="invoice-preview-backdrop"></div>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open invoice-preview-modal">
            <div class="slds-modal__container pdf-modal-container">

                <!-- No header close (X) — avoids duplicate "inside" close; use Cancel or host action chrome -->
                <header class="slds-modal__header slds-modal__header_empty pdf-modal-header pdf-modal-header--no-close">
                    <h2 class="slds-text-heading_medium pdf-modal-title">PDF Preview</h2>
                </header>

                <div class="slds-modal__content pdf-modal-content">
                    <div class="pdf-frame-wrapper">
                        <template if:true={hasPdfUrl}>
                            <iframe
                                src={pdfUrl}
                                class="pdf-frame"
                                title="Invoice PDF Preview"
                                scrolling="auto">
                            </iframe>
                        </template>
                        <template if:false={hasPdfUrl}>
                            <div class="pdf-loading-hint slds-align_absolute-center slds-p-around_large">
                                <lightning-spinner alternative-text="Loading preview"></lightning-spinner>
                                <p class="slds-text-body_small slds-m-top_small slds-text-color_weak">Preparing invoice preview…</p>
                            </div>
                        </template>
                    </div>
                </div>

                <footer class="slds-modal__footer pdf-modal-footer">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Saving..." size="small"></lightning-spinner>
                    </template>
                    <template if:true={isLoadingforSaveandsend}>
                        <lightning-spinner alternative-text="Preparing..." size="small"></lightning-spinner>
                    </template>

                    <lightning-button
                        label="Save Invoice"
                        variant="brand"
                        disabled={isLoading}
                        onclick={handleSaveOnly}
                        class="slds-m-right_x-small">
                    </lightning-button>

                    <lightning-button
                        label="Save &amp; Send Invoice"
                        variant="brand"
                        disabled={isLoadingforSaveandsend}
                        onclick={handleSaveAndSend}
                        class="slds-m-right_x-small">
                    </lightning-button>

                    <button
                        type="button"
                        class="slds-button slds-button_neutral slds-m-left_x-small"
                        title="Cancel"
                        onclick={handleCancel}>
                        Cancel
                    </button>
                </footer>

            </div>
        </section>
    </template>

    <!-- ===== EMAIL COMPOSER ===== -->
    <template if:true={showEmailComposer}>
        <div class="composer-shell">
            <div class="slds-text-align_center slds-p-vertical_small composer-header">
                <h2 class="custom-header">Send Invoice Email</h2>
            </div>

            <div class="slds-card composer-card">
                <div class="composer-scroll-region">
                    <div class="slds-p-around_medium">

                <!-- From -->
                <lightning-combobox
                    label="From"
                    value={fromEmail}
                    options={fromOptions}
                    onchange={handleFromChange}>
                </lightning-combobox>

                <!-- To -->
                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">To</label>
                    <input type="text"
                           class="slds-input"
                           value={toInput}
                           data-field="to"
                           oninput={handleTyping}
                           onkeydown={handleKeyPress}
                           placeholder="Search contact or user email" />

                    <template if:true={toSearchResults.length}>
                        <ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid">
                            <template for:each={toSearchResults} for:item="item">
                                <li key={item.Email}
                                    class="slds-listbox__item"
                                    data-email={item.Email}
                                    data-field="to"
                                    onclick={handleSelect}>
                                    <div class="slds-listbox__option slds-listbox__option_entity slds-p-horizontal_small">
                                        <span>{item.Name} ({item.Email})</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <div class="slds-m-top_x-small">
                        <template for:each={toList} for:item="email">
                            <lightning-pill key={email} label={email} data-field="to" data-email={email} onremove={removeEmail}></lightning-pill>
                        </template>
                    </div>
                </div>

                <!-- Cc -->
                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">Cc</label>
                    <input type="text"
                           class="slds-input"
                           value={ccInput}
                           data-field="cc"
                           oninput={handleTyping}
                           onkeydown={handleKeyPress}
                           placeholder="Search contact or user email" />

                    <template if:true={ccSearchResults.length}>
                        <ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid">
                            <template for:each={ccSearchResults} for:item="item">
                                <li key={item.Email}
                                    class="slds-listbox__item"
                                    data-email={item.Email}
                                    data-field="cc"
                                    onclick={handleSelect}>
                                    <div class="slds-listbox__option slds-listbox__option_entity slds-p-horizontal_small">
                                        <span>{item.Display}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <div class="slds-m-top_x-small">
                        <template for:each={ccList} for:item="email">
                            <lightning-pill key={email} label={email} data-field="cc" data-email={email} onremove={removeEmail}></lightning-pill>
                        </template>
                    </div>
                </div>

                <!-- Bcc -->
                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">Bcc</label>
                    <input type="text"
                           class="slds-input"
                           value={bccInput}
                           data-field="bcc"
                           oninput={handleTyping}
                           onkeydown={handleKeyPress}
                           placeholder="Search contact or user email" />

                    <template if:true={bccSearchResults.length}>
                        <ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid">
                            <template for:each={bccSearchResults} for:item="item">
                                <li key={item.Email}
                                    class="slds-listbox__item"
                                    data-email={item.Email}
                                    data-field="bcc"
                                    onclick={handleSelect}>
                                    <div class="slds-listbox__option slds-listbox__option_entity slds-p-horizontal_small">
                                        <span>{item.Display}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <div class="slds-m-top_x-small">
                        <template for:each={bccList} for:item="email">
                            <lightning-pill key={email} label={email} data-field="bcc" data-email={email} onremove={removeEmail}></lightning-pill>
                        </template>
                    </div>
                </div>

                <!-- Subject -->
                <div class="slds-m-top_small">
                    <lightning-input
                        label="Subject"
                        value={subject}
                        onchange={handleSubjectChange}>
                    </lightning-input>
                </div>

                <!-- Body -->
                <div class="slds-m-top_small composer-body-field">
                    <lightning-input-rich-text
                        label="Body"
                        value={body}
                        onchange={handleBodyChange}>
                    </lightning-input-rich-text>
                </div>
                    </div>

                    <!-- Attachments -->
                    <div class="slds-m-top_medium slds-p-around_small slds-box slds-theme_default slds-rounded_medium composer-attachments">
                        <label class="slds-form-element__label slds-text-title_caps">Attachments</label>

                        <input
                            type="file"
                            multiple
                            class="hidden-file-input"
                            onchange={handleLocalFileUpload} />

                        <lightning-button
                            label="Add Files"
                            icon-name="utility:upload"
                            variant="neutral"
                            class="slds-m-top_x-small"
                            onclick={triggerFileInput}>
                        </lightning-button>

                        <template if:true={attachments.length}>
                            <div class="slds-grid slds-wrap slds-scrollable_y slds-p-around_x-small file-pill-container slds-m-top_small">
                                <template for:each={attachments} for:item="file">
                                    <lightning-pill
                                        key={file.title}
                                        label={file.title}
                                        name={file.title}
                                        onremove={handleRemoveAttachment}
                                        class="slds-m-around_x-small">
                                    </lightning-pill>
                                </template>
                            </div>
                        </template>

                        <template if:false={attachments.length}>
                            <p class="slds-text-color_weak slds-text-align_center slds-m-top_small">
                                No attachments added yet.
                            </p>
                        </template>
                    </div>
                </div>

                <div class="composer-actions">
                    <template if:true={isSending}>
                        <lightning-spinner alternative-text="Sending..." size="small"></lightning-spinner>
                    </template>
                    <lightning-button
                        variant="neutral"
                        label="Back to preview"
                        onclick={handleBackToPreview}
                        disabled={isSending}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <button
                        type="button"
                        class="slds-button slds-button_neutral slds-m-right_x-small"
                        title="Cancel"
                        disabled={isSending}
                        onclick={handleCancel}>
                        Cancel
                    </button>
                    <lightning-button
                        variant="brand"
                        label="Send Email"
                        onclick={handleSend}
                        disabled={isSending}>
                    </lightning-button>
                </div>
            </div>
        </div>

    </template>

</template>
